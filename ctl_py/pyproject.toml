[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-lender-ctl"
description = "Management CLI for storage-lender-server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# protoc 3.21 output needs a google.protobuf runtime of at least 3.20.
dependencies = ["protobuf>=3.20"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
storage-lender-ctl = "storage_lender_ctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "storage_lender_ctl._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PLR0913"]
