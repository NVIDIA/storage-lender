name: Documentation correction
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or source location
      description: Provide a repository path, heading, or public URL.
      placeholder: docs/Architecture.md — Resource Ownership and Lifecycle
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current problem
      description: Explain what is missing, unclear, inconsistent, or incorrect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
      description: Describe the accurate wording, behavior, or example you expect.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Include version, commands, code references, or public sources where useful.
  - type: checkboxes
    id: terms
    attributes:
      label: Submission checks
      options:
        - label: I searched existing documentation issues for duplicates.
          required: true
        - label: I agree to follow the [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
