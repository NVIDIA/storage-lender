syntax = "proto3";

package nvidia.storage_lender.wire.v1;

enum StatusCode {
    OK = 0;
    CANCELLED = 1;
    INVALID_ARGUMENT = 3;
    DEADLINE_EXCEEDED = 4;
    NOT_FOUND = 5;
    PERMISSION_DENIED = 7;
    RESOURCE_EXHAUSTED = 8;
    FAILED_PRECONDITION = 9;
    INTERNAL = 13;
}

message Request {
    uint32 method = 1;
    bytes payload = 2;
}

message Response {
    StatusCode status_code = 1;
    string error_message = 2;
    bytes payload = 3;
}
